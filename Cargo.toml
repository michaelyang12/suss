[package]
name = "suss"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "suss"
path = "src/main.rs"

[dependencies]
conduit = { git = "https://github.com/michaelyang12/conduit.git" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
colored = "2"
atty = "0.2"
