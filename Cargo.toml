[package]
name = "suss"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ss"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
colored = "2"
async-openai = { version = "0.31", features = ["responses"] }
serde_json = "1.0"
atty = "0.2"
